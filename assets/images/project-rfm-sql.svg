  <text x="665" y="352" fill="#a7f3d0" font-family="sans-serif" font-size="10">3,920 (14%)</text>

  <rect x="745" y="310" width="85" height="50" fill="#059669" rx="4"/>
  <text x="760" y="338" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="700">Loyal</text>
  <text x="760" y="352" fill="#a7f3d0" font-family="sans-serif" font-size="10">4,810 (17%)</text>

  <rect x="840" y="310" width="85" height="50" fill="#0284c7" rx="4"/>
  <text x="850" y="338" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="700">Potential</text>
  <text x="850" y="352" fill="#bae6fd" font-family="sans-serif" font-size="10">2,640 (9%)</text>

  <rect x="935" y="310" width="85" height="50" fill="#2563eb" rx="4"/>
  <text x="945" y="338" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="700">Recent</text>
  <text x="945" y="352" fill="#bfdbfe" font-family="sans-serif" font-size="10">1,980 (7%)</text>

  <rect x="1030" y="310" width="85" height="50" fill="#4338ca" rx="4"/>
  <text x="1040" y="338" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="700">Promising</text>
  <text x="1040" y="352" fill="#c7d2fe" font-family="sans-serif" font-size="10">1,120 (4%)</text>

  <!-- Row 2 -->
  <rect x="650" y="370" width="85" height="50" fill="#0d9488" rx="4"/>
  <text x="660" y="400" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="600">Needs Attn</text>

  <rect x="745" y="370" width="85" height="50" fill="#d97706" rx="4"/>
  <text x="755" y="398" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="700">At-Risk</text>
  <text x="755" y="412" fill="#fef3c7" font-family="sans-serif" font-size="10">4,120 (15%)</text>

  <rect x="840" y="370" width="85" height="50" fill="#d97706" rx="4"/>
  <text x="855" y="400" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="600">At-Risk</text>

  <rect x="935" y="370" width="85" height="50" fill="#b45309" rx="4"/>
  <text x="950" y="400" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="600">Cooling</text>

  <rect x="1030" y="370" width="85" height="50" fill="#dc2626" rx="4"/>
  <text x="1045" y="398" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="700">Hibernating</text>
  <text x="1045" y="412" fill="#fee2e2" font-family="sans-serif" font-size="10">3,450 (12%)</text>

  <!-- Row 3 & 4: Sleeping / Lost -->
  <rect x="650" y="430" width="180" height="110" fill="#991b1b" rx="6"/>
  <text x="670" y="475" fill="#ffffff" font-family="sans-serif" font-size="15" font-weight="800">Lost Customers</text>
  <text x="670" y="495" fill="#fecaca" font-family="sans-serif" font-size="12">5,960 users (Inactive &gt;180 days)</text>
  <text x="670" y="520" fill="#fca5a5" font-family="sans-serif" font-size="11">Strategy: Re-engagement email blast</text>

  <rect x="840" y="430" width="275" height="110" fill="#1e293b" stroke="#475569" stroke-width="1" rx="6"/>
  <text x="860" y="465" fill="#38bdf8" font-family="sans-serif" font-size="14" font-weight="700">Action Plan for At-Risk ($180k CLV)</text>
  <text x="860" y="490" fill="#cbd5e1" font-family="sans-serif" font-size="12">• Trigger personalized loyalty offer</text>
