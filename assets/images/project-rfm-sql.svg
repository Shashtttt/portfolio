  <text x="620" y="265" fill="#f8fafc" font-family="sans-serif" font-size="16" font-weight="700">RFM Customer Segment Distribution (Recency vs. Frequency)</text>
  <text x="620" y="285" fill="#94a3b8" font-family="sans-serif" font-size="12">Interactive visual mapping 28,000 customers into actionable clusters</text>

