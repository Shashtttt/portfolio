  <text x="635" y="135" fill="#94a3b8" font-family="sans-serif" font-size="12" font-weight="600">AVG CUSTOMER LIFETIME VALUE</text>
  <text x="635" y="175" fill="#38bdf8" font-family="sans-serif" font-size="32" font-weight="800">$845.20</text>

  <rect x="910" y="105" width="265" height="105" rx="12" fill="url(#cardGrad3)" stroke="#334155" stroke-width="1"/>
  <text x="930" y="135" fill="#94a3b8" font-family="sans-serif" font-size="12" font-weight="600">RE-ENGAGEMENT ROI</text>
  <text x="930" y="175" fill="#a855f7" font-family="sans-serif" font-size="32" font-weight="800">4.8x</text>

  <!-- Left: SQL Query & Segmentation Logic -->
  <rect x="25" y="230" width="550" height="420" rx="12" fill="#0b1120" stroke="#1e293b" stroke-width="1"/>
  <rect x="25" y="230" width="550" height="38" rx="12" fill="#1e293b"/>
  <text x="45" y="255" fill="#38bdf8" font-family="monospace" font-size="13" font-weight="700">sql/03_rfm_scores.sql</text>

  <!-- Code lines -->
  <text x="45" y="295" fill="#93c5fd" font-family="monospace" font-size="12">WITH rfm_base AS (</text>
  <text x="65" y="318" fill="#e2e8f0" font-family="monospace" font-size="12">SELECT customer_id,</text>
  <text x="85" y="341" fill="#facc15" font-family="monospace" font-size="12">CURRENT_DATE - MAX(order_date) AS recency,</text>
  <text x="85" y="364" fill="#a78bfa" font-family="monospace" font-size="12">COUNT(DISTINCT order_id) AS frequency,</text>
  <text x="85" y="387" fill="#34d399" font-family="monospace" font-size="12">SUM(total_amount) AS monetary_value</text>
  <text x="65" y="410" fill="#e2e8f0" font-family="monospace" font-size="12">FROM orders GROUP BY customer_id</text>
  <text x="45" y="433" fill="#93c5fd" font-family="monospace" font-size="12">), scores AS (</text>
  <text x="65" y="456" fill="#e2e8f0" font-family="monospace" font-size="12">SELECT customer_id,</text>
  <text x="85" y="479" fill="#38bdf8" font-family="monospace" font-size="12">NTILE(5) OVER(ORDER BY recency DESC) AS r_score,</text>
  <text x="85" y="502" fill="#38bdf8" font-family="monospace" font-size="12">NTILE(5) OVER(ORDER BY frequency ASC) AS f_score,</text>
  <text x="85" y="525" fill="#38bdf8" font-family="monospace" font-size="12">NTILE(5) OVER(ORDER BY monetary_value ASC) AS m_score</text>
  <text x="65" y="548" fill="#e2e8f0" font-family="monospace" font-size="12">FROM rfm_base</text>
  <text x="45" y="571" fill="#93c5fd" font-family="monospace" font-size="12">)</text>
  <text x="45" y="594" fill="#cbd5e1" font-family="monospace" font-size="12">SELECT * FROM customer_segments;</text>

  <rect x="40" y="612" width="520" height="25" rx="5" fill="#1e293b"/>
  <text x="50" y="629" fill="#10b981" font-family="monospace" font-size="11">✓ Executed in 142ms across 2.4 million rows</text>

  <!-- Right: 5x5 RFM Grid Matrix Heatmap -->
