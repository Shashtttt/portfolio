  <rect x="320" y="105" width="265" height="105" rx="12" fill="url(#cardGrad3)" stroke="#334155" stroke-width="1"/>
  <text x="340" y="135" fill="#94a3b8" font-family="sans-serif" font-size="12" font-weight="600">AT-RISK SEGMENT SIZE</text>
  <text x="340" y="175" fill="#f59e0b" font-family="sans-serif" font-size="32" font-weight="800">4,120</text>
