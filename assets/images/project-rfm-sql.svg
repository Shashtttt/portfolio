  <rect width="1200" height="675" fill="url(#rfmBg)"/>

  <!-- Top App Navigation Bar -->
  <rect x="25" y="25" width="1150" height="60" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <circle cx="55" cy="55" r="7" fill="#ef4444"/>
  <circle cx="75" cy="55" r="7" fill="#f59e0b"/>
  <circle cx="95" cy="55" r="7" fill="#10b981"/>
  <text x="130" y="60" fill="#38bdf8" font-family="monospace" font-size="15" font-weight="700">PostgreSQL + Tableau RFM Segmentation</text>
  <text x="500" y="60" fill="#94a3b8" font-family="sans-serif" font-size="13">| CTEs, Window Functions (NTILE), &amp; Cohort Retention</text>
  <rect x="1000" y="40" width="150" height="30" rx="6" fill="#0284c7"/>
  <text x="1015" y="60" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="700">120,000 Orders</text>

  <!-- KPI Cards -->
  <rect x="25" y="105" width="265" height="105" rx="12" fill="url(#cardGrad3)" stroke="#334155" stroke-width="1"/>
  <text x="45" y="135" fill="#94a3b8" font-family="sans-serif" font-size="12" font-weight="600">CHAMPIONS REVENUE SHARE</text>
  <text x="45" y="175" fill="#10b981" font-family="sans-serif" font-size="32" font-weight="800">58.4%</text>
