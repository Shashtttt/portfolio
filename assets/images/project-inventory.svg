<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="invBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="cardGrad4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="excelGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#invBg)"/>

  <!-- Top App Navigation Bar -->
  <rect x="25" y="25" width="1150" height="60" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <circle cx="55" cy="55" r="7" fill="#ef4444"/>
  <circle cx="75" cy="55" r="7" fill="#f59e0b"/>
  <circle cx="95" cy="55" r="7" fill="#10b981"/>
  <text x="130" y="60" fill="#34d399" font-family="sans-serif" font-size="15" font-weight="700">Excel / Power Query / Python</text>
  <text x="380" y="60" fill="#94a3b8" font-family="sans-serif" font-size="13">| Retail Inventory Optimization &amp; Safety Stock Forecasting</text>
  <rect x="1000" y="40" width="150" height="30" rx="6" fill="#059669"/>
  <text x="1025" y="60" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="700">Dynamic Model</text>

  <!-- KPI Cards -->
  <rect x="25" y="105" width="265" height="105" rx="12" fill="url(#cardGrad4)" stroke="#334155" stroke-width="1"/>
  <text x="45" y="135" fill="#94a3b8" font-family="sans-serif" font-size="12" font-weight="600">STOCKOUT REDUCTION</text>
  <text x="45" y="175" fill="#34d399" font-family="sans-serif" font-size="32" font-weight="800">-42.5%</text>
  <text x="170" y="173" fill="#64748b" font-family="sans-serif" font-size="12">across 850 SKUs</text>

  <rect x="320" y="105" width="265" height="105" rx="12" fill="url(#cardGrad4)" stroke="#334155" stroke-width="1"/>
  <text x="340" y="135" fill="#94a3b8" font-family="sans-serif" font-size="12" font-weight="600">HOLDING COST SAVED</text>
  <text x="340" y="175" fill="#38bdf8" font-family="sans-serif" font-size="32" font-weight="800">$87,400</text>
  <text x="480" y="173" fill="#64748b" font-family="sans-serif" font-size="12">Annualized</text>

  <rect x="615" y="105" width="265" height="105" rx="12" fill="url(#cardGrad4)" stroke="#334155" stroke-width="1"/>
  <text x="635" y="135" fill="#94a3b8" font-family="sans-serif" font-size="12" font-weight="600">INVENTORY TURNOVER RATIO</text>
  <text x="635" y="175" fill="#facc15" font-family="sans-serif" font-size="32" font-weight="800">8.4x</text>
  <text x="710" y="173" fill="#64748b" font-family="sans-serif" font-size="12">up from 5.8x</text>

  <rect x="910" y="105" width="265" height="105" rx="12" fill="url(#cardGrad4)" stroke="#334155" stroke-width="1"/>
  <text x="930" y="135" fill="#94a3b8" font-family="sans-serif" font-size="12" font-weight="600">SERVICE LEVEL TARGET</text>
  <text x="930" y="175" fill="#a78bfa" font-family="sans-serif" font-size="32" font-weight="800">98.5%</text>
  <text x="1035" y="173" fill="#64748b" font-family="sans-serif" font-size="12">Z-score = 2.17</text>

  <!-- Left: Reorder Point & Safety Stock Curve -->
  <rect x="25" y="230" width="700" height="420" rx="12" fill="url(#cardGrad4)" stroke="#334155" stroke-width="1"/>
  <text x="50" y="265" fill="#f8fafc" font-family="sans-serif" font-size="16" font-weight="700">Sawtooth Inventory Cycle &amp; Dynamic Reorder Point (ROP)</text>
  <text x="50" y="285" fill="#94a3b8" font-family="sans-serif" font-size="12">ROP = (Average Daily Demand × Lead Time) + Safety Stock</text>

  <!-- Sawtooth Curve -->
  <polyline points="60,340 180,520 180,340 300,530 300,340 420,510 420,340 540,525 540,340 660,530" fill="none" stroke="#38bdf8" stroke-width="3"/>

  <!-- Safety Stock line -->
  <line x1="50" y1="560" x2="680" y2="560" stroke="#f43f5e" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="550" y="552" fill="#f43f5e" font-family="sans-serif" font-size="12" font-weight="700">Safety Stock Threshold</text>

  <!-- Reorder Point line -->
  <line x1="50" y1="460" x2="680" y2="460" stroke="#facc15" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="530" y="452" fill="#facc15" font-family="sans-serif" font-size="12" font-weight="700">Reorder Point (ROP) = 450 units</text>

  <rect x="50" y="590" width="650" height="45" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="70" y="618" fill="#cbd5e1" font-family="monospace" font-size="12">=ROUNDUP((B4*C4) + (NORM.S.INV(0.985)*SQRT((C4*E4^2)+(B4^2*F4^2))), 0)</text>

  <!-- Right: SKU Pareto Classification (ABC Analysis) -->
  <rect x="745" y="230" width="430" height="420" rx="12" fill="url(#cardGrad4)" stroke="#334155" stroke-width="1"/>
  <text x="770" y="265" fill="#f8fafc" font-family="sans-serif" font-size="16" font-weight="700">SKU ABC / Pareto Breakdown</text>
  <text x="770" y="285" fill="#94a3b8" font-family="sans-serif" font-size="12">80/20 Rule Applied to 850 Retail Items</text>

  <!-- Class A -->
  <rect x="770" y="320" width="380" height="85" rx="8" fill="#1e293b" stroke="#059669" stroke-width="2"/>
  <text x="790" y="348" fill="#34d399" font-family="sans-serif" font-size="15" font-weight="800">Class A Items (Top 20% SKUs)</text>
  <text x="790" y="370" fill="#e2e8f0" font-family="sans-serif" font-size="13">Generates 72% of total store revenue</text>
  <text x="790" y="390" fill="#94a3b8" font-family="sans-serif" font-size="12">Policy: Continuous weekly review, strict safety buffer</text>

  <!-- Class B -->
  <rect x="770" y="420" width="380" height="85" rx="8" fill="#1e293b" stroke="#0284c7" stroke-width="1"/>
  <text x="790" y="448" fill="#38bdf8" font-family="sans-serif" font-size="15" font-weight="800">Class B Items (Next 30% SKUs)</text>
  <text x="790" y="470" fill="#e2e8f0" font-family="sans-serif" font-size="13">Generates 21% of revenue</text>
  <text x="790" y="490" fill="#94a3b8" font-family="sans-serif" font-size="12">Policy: Bi-weekly batch ordering</text>

  <!-- Class C -->
  <rect x="770" y="520" width="380" height="85" rx="8" fill="#1e293b" stroke="#64748b" stroke-width="1"/>
  <text x="790" y="548" fill="#94a3b8" font-family="sans-serif" font-size="15" font-weight="800">Class C Items (Bottom 50% SKUs)</text>
  <text x="790" y="570" fill="#cbd5e1" font-family="sans-serif" font-size="13">Generates only 7% of revenue</text>
  <text x="790" y="590" fill="#94a3b8" font-family="sans-serif" font-size="12">Policy: Bulk quarterly orders, minimized holding costs</text>
</svg>

