  <text x="960" y="335" fill="#f8fafc" font-family="sans-serif" font-size="13" font-weight="700">Confusion Matrix</text>

  <!-- 4 cells -->
  <rect x="930" y="350" width="95" height="65" fill="#1e3a5f" rx="4"/>
  <text x="945" y="380" fill="#38bdf8" font-family="sans-serif" font-size="15" font-weight="800">TN: 3,420</text>
  <text x="945" y="400" fill="#94a3b8" font-family="sans-serif" font-size="11">Retained</text>

  <rect x="1035" y="350" width="95" height="65" fill="#3f1d24" rx="4"/>
  <text x="1050" y="380" fill="#fb7185" font-family="sans-serif" font-size="15" font-weight="800">FP: 280</text>
  <text x="1050" y="400" fill="#94a3b8" font-family="sans-serif" font-size="11">False Alarm</text>

  <rect x="930" y="425" width="95" height="65" fill="#3f1d24" rx="4"/>
  <text x="945" y="455" fill="#fb7185" font-family="sans-serif" font-size="15" font-weight="800">FN: 190</text>
  <text x="945" y="475" fill="#94a3b8" font-family="sans-serif" font-size="11">Missed</text>

  <rect x="1035" y="425" width="95" height="65" fill="#064e3b" rx="4"/>
  <text x="1050" y="455" fill="#34d399" font-family="sans-serif" font-size="15" font-weight="800">TP: 1,110</text>
  <text x="1050" y="475" fill="#94a3b8" font-family="sans-serif" font-size="11">Caught Churn</text>

  <!-- Summary text bottom -->
  <rect x="640" y="565" width="510" height="65" rx="8" fill="#111827" stroke="#334155" stroke-width="1"/>
  <text x="660" y="590" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="700">🎯 Business Impact:</text>
  <text x="660" y="612" fill="#94a3b8" font-family="sans-serif" font-size="12">Model flags 85% of churning customers 30 days prior to contract cancellation.</text>
