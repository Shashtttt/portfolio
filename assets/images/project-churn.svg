  <rect x="615" y="230" width="560" height="420" rx="12" fill="url(#cardBg)" stroke="#334155" stroke-width="1"/>
  <text x="640" y="265" fill="#f8fafc" font-family="sans-serif" font-size="16" font-weight="700">Model Evaluation &amp; ROC-AUC Curve</text>
  <text x="640" y="285" fill="#94a3b8" font-family="sans-serif" font-size="12">Tested on 5,000 holdout validation records</text>

  <!-- ROC Box -->
  <rect x="640" y="310" width="240" height="210" fill="#0f172a" stroke="#334155" stroke-width="1" rx="6"/>
  <line x1="640" y1="520" x2="880" y2="310" stroke="#475569" stroke-width="1" stroke-dasharray="4,4"/>
  <!-- Smooth ROC Curve -->
  <path d="M 640 520 Q 660 360 740 330 T 880 310" fill="none" stroke="#38bdf8" stroke-width="3"/>
  <text x="740" y="420" fill="#38bdf8" font-family="sans-serif" font-size="13" font-weight="700">AUC = 0.892</text>
  <text x="710" y="540" fill="#64748b" font-family="sans-serif" font-size="11">False Positive Rate</text>

  <!-- Confusion Matrix Box -->
