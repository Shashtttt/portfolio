  <!-- Feature 4 -->
  <text x="50" y="445" fill="#e2e8f0" font-family="monospace" font-size="12">tech_support_tickets (&gt;3)</text>
  <rect x="290" y="432" width="280" height="16" rx="4" fill="#1e293b"/>
  <rect x="290" y="432" width="150" height="16" rx="4" fill="url(#coralGrad)"/>
  <text x="390" y="445" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="700">+0.198</text>

