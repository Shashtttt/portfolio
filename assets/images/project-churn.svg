  <text x="45" y="175" fill="#f43f5e" font-family="sans-serif" font-size="32" font-weight="800">26.8%</text>
  <text x="155" y="173" fill="#64748b" font-family="sans-serif" font-size="13">→ Reduced to 18.2%</text>

  <rect x="320" y="105" width="265" height="105" rx="12" fill="url(#cardBg)" stroke="#334155" stroke-width="1"/>
  <text x="340" y="135" fill="#94a3b8" font-family="sans-serif" font-size="12" font-weight="600">AT-RISK REVENUE IDENTIFIED</text>
  <text x="340" y="175" fill="#f59e0b" font-family="sans-serif" font-size="32" font-weight="800">$420,000</text>

  <rect x="615" y="105" width="265" height="105" rx="12" fill="url(#cardBg)" stroke="#334155" stroke-width="1"/>
  <text x="635" y="135" fill="#94a3b8" font-family="sans-serif" font-size="12" font-weight="600">PRECISION / RECALL</text>
  <text x="635" y="175" fill="#38bdf8" font-family="sans-serif" font-size="32" font-weight="800">84% / 78%</text>

  <rect x="910" y="105" width="265" height="105" rx="12" fill="url(#cardBg)" stroke="#334155" stroke-width="1"/>
  <text x="930" y="135" fill="#94a3b8" font-family="sans-serif" font-size="12" font-weight="600">ANNUAL ARR SAVED</text>
  <text x="930" y="175" fill="#34d399" font-family="sans-serif" font-size="32" font-weight="800">$165,000</text>

