  <circle cx="75" cy="55" r="7" fill="#f59e0b"/>
  <circle cx="95" cy="55" r="7" fill="#10b981"/>
  <text x="130" y="60" fill="#f8fafc" font-family="monospace" font-size="15" font-weight="700">churn_prediction_xgboost.ipynb</text>
  <text x="440" y="60" fill="#94a3b8" font-family="sans-serif" font-size="13">| Python (pandas, scikit-learn, shap, seaborn)</text>
  <rect x="1010" y="40" width="140" height="30" rx="6" fill="#047857"/>
  <text x="1030" y="60" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="700">✓ Model AUC: 0.89</text>

