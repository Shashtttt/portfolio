  <rect x="290" y="512" width="240" height="16" rx="4" fill="#10b981"/>
  <text x="475" y="525" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="700">-0.320 (Retention)</text>

  <rect x="50" y="565" width="520" height="65" rx="8" fill="#111827" stroke="#334155" stroke-width="1"/>
  <text x="70" y="590" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="700">💡 Key Business Recommendation:</text>
  <text x="70" y="612" fill="#94a3b8" font-family="sans-serif" font-size="12">Offer 15% discount vouchers to month-to-month customers reaching month 3.</text>

