<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1f2937" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#111827" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="glow"/>
      <feComposite in="SourceGraphic" in2="glow" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid Pattern -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="135" x2="1200" y2="135"/>
    <line x1="0" y1="270" x2="1200" y2="270"/>
    <line x1="0" y1="405" x2="1200" y2="405"/>
    <line x1="0" y1="540" x2="1200" y2="540"/>
    <line x1="240" y1="0" x2="240" y2="675"/>
    <line x1="480" y1="0" x2="480" y2="675"/>
    <line x1="720" y1="0" x2="720" y2="675"/>
    <line x1="960" y1="0" x2="960" y2="675"/>
  </g>

  <!-- Top App Navigation Bar -->
  <rect x="25" y="25" width="1150" height="60" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <circle cx="55" cy="55" r="7" fill="#ef4444"/>
  <circle cx="75" cy="55" r="7" fill="#f59e0b"/>
  <circle cx="95" cy="55" r="7" fill="#10b981"/>
  <text x="130" y="60" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700">Power BI Executive Dashboard</text>
  <text x="360" y="60" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13">| Global Sales &amp; Margin Analysis (Q1 - Q4)</text>

  <!-- Filter Pills -->
  <rect x="800" y="40" width="100" height="30" rx="15" fill="#0f172a" stroke="#475569" stroke-width="1"/>
  <text x="825" y="60" fill="#cbd5e1" font-family="sans-serif" font-size="12">Region: All</text>
  <rect x="915" y="40" width="110" height="30" rx="15" fill="#0f172a" stroke="#475569" stroke-width="1"/>
  <text x="930" y="60" fill="#cbd5e1" font-family="sans-serif" font-size="12">Year: 2024</text>
  <rect x="1040" y="40" width="110" height="30" rx="15" fill="#0284c7"/>
  <text x="1055" y="60" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="600">Export Report</text>

  <!-- KPI Cards -->
  <!-- KPI 1 -->
  <rect x="25" y="105" width="265" height="110" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
  <text x="45" y="135" fill="#94a3b8" font-family="sans-serif" font-size="13" font-weight="600">TOTAL REVENUE</text>
  <text x="45" y="178" fill="#f8fafc" font-family="sans-serif" font-size="30" font-weight="800">$4,852,190</text>
  <rect x="45" y="190" width="80" height="18" rx="9" fill="#065f46"/>
  <text x="55" y="203" fill="#34d399" font-family="sans-serif" font-size="11" font-weight="700">▲ +18.4% YoY</text>

  <!-- KPI 2 -->
  <rect x="320" y="105" width="265" height="110" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
  <text x="340" y="135" fill="#94a3b8" font-family="sans-serif" font-size="13" font-weight="600">GROSS PROFIT MARGIN</text>
  <text x="340" y="178" fill="#38bdf8" font-family="sans-serif" font-size="30" font-weight="800">32.6%</text>
  <rect x="340" y="190" width="85" height="18" rx="9" fill="#0c4a6e"/>
  <text x="350" y="203" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="700">Target: 30.0%</text>

  <!-- KPI 3 -->
  <rect x="615" y="105" width="265" height="110" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
  <text x="635" y="135" fill="#94a3b8" font-family="sans-serif" font-size="13" font-weight="600">ACTIVE CUSTOMERS</text>
  <text x="635" y="178" fill="#f8fafc" font-family="sans-serif" font-size="30" font-weight="800">18,420</text>
  <rect x="635" y="190" width="80" height="18" rx="9" fill="#065f46"/>
  <text x="645" y="203" fill="#34d399" font-family="sans-serif" font-size="11" font-weight="700">▲ +12.1% MoM</text>

  <!-- KPI 4 -->
  <rect x="910" y="105" width="265" height="110" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
  <text x="930" y="135" fill="#94a3b8" font-family="sans-serif" font-size="13" font-weight="600">AVG ORDER VALUE (AOV)</text>
  <text x="930" y="178" fill="#a78bfa" font-family="sans-serif" font-size="30" font-weight="800">$263.40</text>
  <rect x="930" y="190" width="75" height="18" rx="9" fill="#4c1d95"/>
  <text x="940" y="203" fill="#c4b5fd" font-family="sans-serif" font-size="11" font-weight="700">▲ +$24.10</text>

  <!-- Main Chart 1: Revenue & Forecast Line/Area Chart -->
  <rect x="25" y="235" width="700" height="250" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
  <text x="50" y="270" fill="#f8fafc" font-family="sans-serif" font-size="16" font-weight="700">Monthly Revenue vs. Budget Target (2024)</text>
  <text x="50" y="290" fill="#94a3b8" font-family="sans-serif" font-size="12">Interactive DAX cumulative measure with 95% confidence band</text>

  <!-- Target dotted line -->
  <line x1="60" y1="410" x2="680" y2="330" stroke="#f59e0b" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="620" y="325" fill="#f59e0b" font-family="sans-serif" font-size="11" font-weight="600">Budget Target</text>

  <!-- Area Fill -->
  <polygon points="70,430 130,410 190,420 250,380 310,390 370,350 430,340 490,320 550,290 610,270 670,250 670,450 70,450" fill="url(#cyanGrad)" fill-opacity="0.15"/>
  
  <!-- Actual Line Curve -->
  <polyline points="70,430 130,410 190,420 250,380 310,390 370,350 430,340 490,320 550,290 610,270 670,250" fill="none" stroke="#38bdf8" stroke-width="4" filter="url(#glow)"/>

  <!-- Data points -->
  <circle cx="70" cy="430" r="4" fill="#38bdf8"/>
  <circle cx="190" cy="420" r="4" fill="#38bdf8"/>
  <circle cx="370" cy="350" r="4" fill="#38bdf8"/>
  <circle cx="490" cy="320" r="4" fill="#38bdf8"/>
  <circle cx="610" cy="270" r="4" fill="#38bdf8"/>
  <circle cx="670" cy="250" r="6" fill="#ffffff" stroke="#0284c7" stroke-width="3"/>
  <text x="635" y="235" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="700">$540k</text>

  <!-- Axis labels -->
  <text x="65" y="470" fill="#64748b" font-family="sans-serif" font-size="11">Jan</text>
  <text x="125" y="470" fill="#64748b" font-family="sans-serif" font-size="11">Feb</text>
  <text x="185" y="470" fill="#64748b" font-family="sans-serif" font-size="11">Mar</text>
  <text x="245" y="470" fill="#64748b" font-family="sans-serif" font-size="11">Apr</text>
  <text x="305" y="470" fill="#64748b" font-family="sans-serif" font-size="11">May</text>
  <text x="365" y="470" fill="#64748b" font-family="sans-serif" font-size="11">Jun</text>
  <text x="425" y="470" fill="#64748b" font-family="sans-serif" font-size="11">Jul</text>
  <text x="485" y="470" fill="#64748b" font-family="sans-serif" font-size="11">Aug</text>
  <text x="545" y="470" fill="#64748b" font-family="sans-serif" font-size="11">Sep</text>
  <text x="605" y="470" fill="#64748b" font-family="sans-serif" font-size="11">Oct</text>
  <text x="665" y="470" fill="#64748b" font-family="sans-serif" font-size="11">Nov</text>

  <!-- Right Chart 2: Category Breakdown Donut / Breakdown -->
  <rect x="745" y="235" width="430" height="250" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
  <text x="770" y="270" fill="#f8fafc" font-family="sans-serif" font-size="16" font-weight="700">Revenue by Product Line</text>
  <text x="770" y="290" fill="#94a3b8" font-family="sans-serif" font-size="12">SaaS Enterprise vs. Pro &amp; Consumer</text>

  <!-- Donut Ring Simulation -->
  <circle cx="850" cy="380" r="65" fill="none" stroke="#1e293b" stroke-width="24"/>
  <circle cx="850" cy="380" r="65" fill="none" stroke="#38bdf8" stroke-width="24" stroke-dasharray="210 300" stroke-dashoffset="0"/>
  <circle cx="850" cy="380" r="65" fill="none" stroke="#a855f7" stroke-width="24" stroke-dasharray="110 300" stroke-dashoffset="-210"/>
  <circle cx="850" cy="380" r="65" fill="none" stroke="#10b981" stroke-width="24" stroke-dasharray="60 300" stroke-dashoffset="-320"/>
  <text x="830" y="385" fill="#f8fafc" font-family="sans-serif" font-size="18" font-weight="800">54%</text>

  <!-- Legend -->
  <circle cx="960" cy="340" r="6" fill="#38bdf8"/>
  <text x="975" y="344" fill="#e2e8f0" font-family="sans-serif" font-size="13">Enterprise Cloud (54%)</text>
  
  <circle cx="960" cy="375" r="6" fill="#a855f7"/>
  <text x="975" y="379" fill="#e2e8f0" font-family="sans-serif" font-size="13">Professional Tier (28%)</text>
  
  <circle cx="960" cy="410" r="6" fill="#10b981"/>
  <text x="975" y="414" fill="#e2e8f0" font-family="sans-serif" font-size="13">Add-ons &amp; API (18%)</text>

  <!-- Bottom Bar Chart: Regional Performance -->
  <rect x="25" y="505" width="1150" height="145" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
  <text x="50" y="535" fill="#f8fafc" font-family="sans-serif" font-size="15" font-weight="700">Regional Profit Margin vs. Discount Rate Analysis</text>

  <!-- Bar 1 -->
  <text x="50" y="565" fill="#94a3b8" font-family="sans-serif" font-size="12">North America</text>
  <rect x="180" y="552" width="700" height="16" rx="8" fill="#1e293b"/>
  <rect x="180" y="552" width="580" height="16" rx="8" fill="url(#cyanGrad)"/>
  <text x="770" y="565" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="700">$2.42M (34.2%)</text>

  <!-- Bar 2 -->
  <text x="50" y="595" fill="#94a3b8" font-family="sans-serif" font-size="12">Europe (EMEA)</text>
  <rect x="180" y="582" width="700" height="16" rx="8" fill="#1e293b"/>
  <rect x="180" y="582" width="410" height="16" rx="8" fill="url(#purpleGrad)"/>
  <text x="600" y="595" fill="#c084fc" font-family="sans-serif" font-size="12" font-weight="700">$1.65M (29.8%)</text>

  <!-- Bar 3 -->
  <text x="50" y="625" fill="#94a3b8" font-family="sans-serif" font-size="12">Asia-Pacific (APAC)</text>
  <rect x="180" y="612" width="700" height="16" rx="8" fill="#1e293b"/>
  <rect x="180" y="612" width="220" height="16" rx="8" fill="url(#greenGrad)"/>
  <text x="410" y="625" fill="#34d399" font-family="sans-serif" font-size="12" font-weight="700">$780k (31.5%)</text>
</svg>

